name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -e . pytest
      - name: Run tests
        run: pytest tests/ -v
      - name: Reproduce harness-validation results
        run: python scripts/run_demo.py > /dev/null && git diff --exit-code results/sim_results.md
